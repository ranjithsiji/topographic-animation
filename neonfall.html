<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cascade</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #040820; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed; right: 0; top: 0;
            height: 100vh; width: 270px;
            background: rgba(2, 4, 20, 0.96);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100; overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed; right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(2, 4, 20, 0.9);
            border: 1px solid var(--accent); border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 101; font-size: 20px; line-height: 1; padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }
        .row { margin-bottom: 18px; }
        label {
            display: flex; justify-content: space-between;
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 7px; color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none; border-radius: 5px; flex-shrink: 0;
        }
        .color-hint { font-size: 11px; color: #555; }
        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 18px 0; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Background</label>
            <div class="flex-row">
                <input type="color" id="bgColor" value="#040820">
                <span class="color-hint">Sky color</span>
            </div>
        </div>

        <div class="row">
            <label>Primary Color</label>
            <div class="flex-row">
                <input type="color" id="primaryColor" value="#aa44ee">
                <span class="color-hint">Main streaks</span>
            </div>
        </div>

        <div class="row">
            <label>Accent Color</label>
            <div class="flex-row">
                <input type="color" id="accentColor" value="#ffaa00">
                <span class="color-hint">Secondary streaks</span>
            </div>
        </div>

        <div class="row">
            <label>Accent Ratio % <span class="val" id="accent-val">76</span></label>
            <input type="range" id="accentRatio" min="0" max="100" value="76">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Streak Count <span class="val" id="count-val">500</span></label>
            <input type="range" id="streakCount" min="30" max="500" step="10" value="500">
        </div>

        <div class="row">
            <label>Speed <span class="val" id="speed-val">3</span></label>
            <input type="range" id="speed" min="1" max="15" value="3">
        </div>

        <div class="row">
            <label>Trail Length <span class="val" id="trail-val">64</span></label>
            <input type="range" id="trailLen" min="5" max="80" value="64">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Glow Intensity <span class="val" id="glow-val">9</span></label>
            <input type="range" id="glowIntensity" min="0" max="35" value="9">
        </div>

        <div class="row">
            <label>Floor Position % <span class="val" id="floor-val">88</span></label>
            <input type="range" id="floorPos" min="40" max="92" value="88">
        </div>

        <div class="row">
            <label>Convergence % <span class="val" id="conv-val">0</span></label>
            <input type="range" id="convergence" min="0" max="100" value="0">
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    const gui = {
        bgColor:      document.getElementById('bgColor'),
        primaryColor: document.getElementById('primaryColor'),
        accentColor:  document.getElementById('accentColor'),
        accentRatio:  document.getElementById('accentRatio'),
        streakCount:  document.getElementById('streakCount'),
        speed:        document.getElementById('speed'),
        trailLen:     document.getElementById('trailLen'),
        glowIntensity:document.getElementById('glowIntensity'),
        floorPos:     document.getElementById('floorPos'),
        convergence:  document.getElementById('convergence'),
    };

    let width, height;
    let streaks = [];

    const FLOOR_T = 0.58; // fraction of path where arc begins
    const SAMPLES = 16;   // trail segments per streak

    function hexRgb(hex) {
        return [
            parseInt(hex.slice(1,3), 16),
            parseInt(hex.slice(3,5), 16),
            parseInt(hex.slice(5,7), 16),
        ];
    }

    // Returns {x,y} for a streak at startX, at path progress s (0=top, 1=exit)
    function getPos(startX, s) {
        const conv  = parseInt(gui.convergence.value) / 100;
        const frac  = parseInt(gui.floorPos.value) / 100;

        const hw    = width * 0.5;
        const nx    = (startX - hw) / hw;   // -1 to 1
        const absNx = Math.abs(nx);
        const sign  = nx >= 0 ? 1 : -1;

        // All streaks converge toward center at the floor
        const floorX = hw + nx * hw * (1 - conv);
        const floorY = height * frac;

        // After arc, exit past screen edge proportional to original distance from center
        const exitX = floorX + sign * absNx * width * 1.12;
        const exitY = height * 1.06;

        const sc = Math.max(0, Math.min(1, s));

        if (sc <= FLOOR_T) {
            // Falling phase: quadratic bezier, startX → floor
            const u  = sc / FLOOR_T;
            const eu = u * u * (3 - 2 * u); // smoothstep
            const cpX = startX * 0.45 + floorX * 0.55;
            const cpY = floorY * 0.28;
            return {
                x: (1-eu)*(1-eu)*startX + 2*(1-eu)*eu*cpX + eu*eu*floorX,
                y: (1-eu)*(1-eu)*(-25)  + 2*(1-eu)*eu*cpY + eu*eu*floorY,
            };
        } else {
            // Arc phase: quadratic bezier, floor → exit
            const u  = (sc - FLOOR_T) / (1 - FLOOR_T);
            const eu = u * u * (3 - 2 * u);
            // Control point: sideways first (smooth arc), then continues to exit
            const cpX = floorX + sign * absNx * hw * 0.88;
            const cpY = floorY + height * 0.032;
            return {
                x: (1-eu)*(1-eu)*floorX + 2*(1-eu)*eu*cpX + eu*eu*exitX,
                y: (1-eu)*(1-eu)*floorY + 2*(1-eu)*eu*cpY + eu*eu*exitY,
            };
        }
    }

    class Streak {
        constructor(init = false) { this.spawn(init); }

        spawn(init = false) {
            this.startX    = Math.random() * width;
            this.t         = init ? Math.random() : 0;
            this.baseSpd   = 0.0028 + Math.random() * 0.0042;
            this.trailVar  = 0.75 + Math.random() * 0.50; // per-streak trail length variation
            this.lw        = 0.6 + Math.random() * 1.7;
            this.isAccent  = Math.random() * 100 < parseInt(gui.accentRatio.value);
            this.opacity   = 0.55 + Math.random() * 0.45;
        }

        update(trailLen) {
            this.t += this.baseSpd * (parseInt(gui.speed.value) / 5);
            if (this.t > 1 + trailLen) this.spawn(false);
        }
    }

    function syncCount() {
        const n = parseInt(gui.streakCount.value);
        while (streaks.length < n) streaks.push(new Streak(false));
        while (streaks.length > n) streaks.pop();
    }

    function frame() {
        const [pr, pg, pb] = hexRgb(gui.primaryColor.value);
        const [ar, ag, ab] = hexRgb(gui.accentColor.value);
        const glowAmt  = parseInt(gui.glowIntensity.value);
        const baseTrail = parseInt(gui.trailLen.value) / 100;

        // Clear
        ctx.fillStyle = gui.bgColor.value;
        ctx.fillRect(0, 0, width, height);

        // Floor area glow
        if (glowAmt > 4) {
            const fy = height * (parseInt(gui.floorPos.value) / 100);
            const ga = (glowAmt / 35) * 0.13;
            const grd = ctx.createRadialGradient(width/2, fy, 0, width/2, fy, width * 0.55);
            grd.addColorStop(0,   `rgba(${pr},${pg},${pb},${ga.toFixed(3)})`);
            grd.addColorStop(0.45,`rgba(${pr},${pg},${pb},${(ga*0.3).toFixed(3)})`);
            grd.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, fy - height * 0.14, width, height * 0.3);
        }

        // Update
        syncCount();
        streaks.forEach(s => s.update(baseTrail * s.trailVar));

        // ── Trail pass (no shadowBlur for performance) ──
        ctx.lineCap = 'butt';
        streaks.forEach(streak => {
            const [r, g, b] = streak.isAccent ? [ar, ag, ab] : [pr, pg, pb];
            const tl    = baseTrail * streak.trailVar;
            const tailS = streak.t - tl;

            for (let i = 1; i <= SAMPLES; i++) {
                const se = tailS + tl * i / SAMPLES;
                const ss = tailS + tl * (i-1) / SAMPLES;
                if (se <= 0 || ss >= 1) continue;
                const cs = Math.max(0, ss);
                const ce = Math.min(1, se);
                if (cs >= ce) continue;

                const p0 = getPos(streak.startX, cs);
                const p1 = getPos(streak.startX, ce);
                const frac = i / SAMPLES; // 0=tail, 1=head
                const a = frac * streak.opacity;

                // Soft outer glow shell — only near the head (top 35%)
                if (frac > 0.65) {
                    ctx.beginPath();
                    ctx.moveTo(p0.x, p0.y);
                    ctx.lineTo(p1.x, p1.y);
                    ctx.strokeStyle = `rgba(${r},${g},${b},${(a * 0.18).toFixed(3)})`;
                    ctx.lineWidth = streak.lw * 5.5;
                    ctx.stroke();
                }

                // Core bright line
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.strokeStyle = `rgba(${r},${g},${b},${(a * 0.92).toFixed(3)})`;
                ctx.lineWidth = streak.lw;
                ctx.stroke();
            }
        });

        // ── Head dots with glow (batched by color group) ──
        if (glowAmt > 0) {
            ctx.save();
            ctx.shadowBlur = glowAmt * 2.8;

            // Primary heads
            ctx.shadowColor = `rgb(${pr},${pg},${pb})`;
            streaks.filter(s => !s.isAccent && s.t > 0 && s.t < 1).forEach(s => {
                const h = getPos(s.startX, s.t);
                ctx.fillStyle = `rgba(210,245,255,${s.opacity.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(h.x, h.y, s.lw * 1.8, 0, Math.PI * 2);
                ctx.fill();
            });

            // Accent heads
            ctx.shadowColor = `rgb(${ar},${ag},${ab})`;
            streaks.filter(s => s.isAccent && s.t > 0 && s.t < 1).forEach(s => {
                const h = getPos(s.startX, s.t);
                ctx.fillStyle = `rgba(240,210,255,${s.opacity.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(h.x, h.y, s.lw * 1.8, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        } else {
            streaks.filter(s => s.t > 0 && s.t < 1).forEach(s => {
                const [r, g, b] = s.isAccent ? [ar, ag, ab] : [pr, pg, pb];
                const h = getPos(s.startX, s.t);
                ctx.fillStyle = `rgba(${r},${g},${b},${s.opacity.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(h.x, h.y, s.lw * 1.8, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        requestAnimationFrame(frame);
    }

    function resize() {
        width  = canvas.width  = window.innerWidth;
        height = canvas.height = window.innerHeight;
        streaks = Array.from({ length: parseInt(gui.streakCount.value) }, () => new Streak(true));
    }

    // Panel toggle
    const panel     = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    gui.bgColor.addEventListener('input', () => {
        document.body.style.backgroundColor = gui.bgColor.value;
    });

    [['accentRatio','accent-val'],['streakCount','count-val'],['speed','speed-val'],
     ['trailLen','trail-val'],['glowIntensity','glow-val'],['floorPos','floor-val'],
     ['convergence','conv-val']
    ].forEach(([id, vid]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(vid).textContent = e.target.value;
        });
    });

    window.addEventListener('resize', resize);
    resize();
    frame();

    // Rainbow accent cycling
    let _hue = Math.random() * 360;
    (function cycleAccent() {
        _hue = (_hue + 0.18) % 360;
        const acc = `hsl(${_hue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', acc);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = acc);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
