<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Fluid Topography</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed;
            right: 0; top: 0;
            height: 100vh;
            width: 270px;
            background: rgba(5, 5, 5, 0.93);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(12, 12, 12, 0.88);
            border: 1px solid var(--accent);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }

        .row { margin-bottom: 18px; }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
            color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none;
            border-radius: 5px; flex-shrink: 0;
        }
        .color-hint { font-size: 11px; color: #555; }

        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Line Color</label>
            <div class="flex-row">
                <input type="color" id="color" value="#ffffff">
                <span class="color-hint">Hue of contours & glow</span>
            </div>
        </div>

        <div class="row">
            <label>Glow Intensity <span class="val" id="glow-val">0</span></label>
            <input type="range" id="glowIntensity" min="0" max="30" value="0">
        </div>

        <div class="row">
            <label>Line Width <span class="val" id="width-val">1.8</span></label>
            <input type="range" id="lineWidth" min="0.5" max="5" step="0.1" value="1.8">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Organic Scale <span class="val" id="zoom-val">500</span></label>
            <input type="range" id="zoom" min="150" max="1000" value="500">
        </div>

        <div class="row">
            <label>Contour Layers <span class="val" id="layers-val">6</span></label>
            <input type="range" id="layers" min="2" max="15" value="6">
        </div>

        <div class="row">
            <label>Morph Speed <span class="val" id="speed-val">10</span></label>
            <input type="range" id="speed" min="0" max="50" value="10">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Trail Effect <span class="val" id="trail-val">0</span></label>
            <input type="range" id="trail" min="0" max="90" value="0">
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const simplex = new SimplexNoise();

    const gui = {
        zoom:      document.getElementById('zoom'),
        layers:    document.getElementById('layers'),
        speed:     document.getElementById('speed'),
        color:     document.getElementById('color'),
        glow:      document.getElementById('glowIntensity'),
        lineWidth: document.getElementById('lineWidth'),
        trail:     document.getElementById('trail'),
    };

    // Live value readouts
    [['zoom','zoom-val'],['layers','layers-val'],['speed','speed-val'],
     ['glowIntensity','glow-val'],['lineWidth','width-val'],['trail','trail-val']
    ].forEach(([id, valId]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(valId).textContent = e.target.value;
        });
    });

    // Panel toggle
    const panel = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    let width, height, z = 0;
    const gridSpacing = 16;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    function getVal(x, y) {
        return simplex.noise3D(x / gui.zoom.value, y / gui.zoom.value, z);
    }

    function animate() {
        const trailStrength = parseInt(gui.trail.value);
        const bgAlpha = 1 - (trailStrength / 100) * 0.95;
        ctx.fillStyle = `rgba(0,0,0,${bgAlpha})`;
        ctx.fillRect(0, 0, width, height);

        const lineColor = gui.color.value;
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = parseFloat(gui.lineWidth.value);
        ctx.lineCap = 'round';

        const glowAmt = parseInt(gui.glow.value);
        ctx.shadowBlur = glowAmt;
        ctx.shadowColor = glowAmt > 0 ? lineColor : 'transparent';

        const numLayers = parseInt(gui.layers.value);

        for (let l = 0; l < numLayers; l++) {
            const threshold = (l / numLayers) * 1.6 - 0.8;
            ctx.beginPath();

            for (let x = 0; x < width; x += gridSpacing) {
                for (let y = 0; y < height; y += gridSpacing) {
                    const v1 = getVal(x, y);
                    const v2 = getVal(x + gridSpacing, y);
                    const v3 = getVal(x + gridSpacing, y + gridSpacing);
                    const v4 = getVal(x, y + gridSpacing);

                    const getPos = (p1, p2, val1, val2) =>
                        p1 + (gridSpacing * (threshold - val1) / (val2 - val1));

                    const pts = [];
                    if ((v1 > threshold) !== (v2 > threshold)) pts.push({x: getPos(x, x+gridSpacing, v1, v2), y});
                    if ((v2 > threshold) !== (v3 > threshold)) pts.push({x: x+gridSpacing, y: getPos(y, y+gridSpacing, v2, v3)});
                    if ((v3 > threshold) !== (v4 > threshold)) pts.push({x: getPos(x, x+gridSpacing, v4, v3), y: y+gridSpacing});
                    if ((v4 > threshold) !== (v1 > threshold)) pts.push({x, y: getPos(y, y+gridSpacing, v1, v4)});

                    if (pts.length >= 2) {
                        ctx.moveTo(pts[0].x, pts[0].y);
                        ctx.lineTo(pts[1].x, pts[1].y);
                    }
                }
            }
            ctx.stroke();
        }

        z += gui.speed.value * 0.0004;
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();

    // Cycling rainbow accent for controls UI
    let _accentHue = Math.random() * 360;
    (function cycleAccent() {
        _accentHue = (_accentHue + 0.18) % 360;
        const accent = `hsl(${_accentHue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', accent);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = accent);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
