<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Arc Lines</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #00081a; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed;
            right: 0; top: 0;
            height: 100vh;
            width: 270px;
            background: rgba(0, 5, 18, 0.95);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(0, 8, 25, 0.9);
            border: 1px solid var(--accent);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }

        .row { margin-bottom: 18px; }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
            color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none;
            border-radius: 5px; flex-shrink: 0;
        }
        .color-hint { font-size: 11px; color: #555; }
        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Arc Color</label>
            <div class="flex-row">
                <input type="color" id="color" value="#5599ff">
                <span class="color-hint">Streak tint</span>
            </div>
        </div>

        <div class="row">
            <label>Horizon Glow <span class="val" id="hglow-val">0</span></label>
            <input type="range" id="hglow" min="0" max="40" value="0">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Particle Count <span class="val" id="count-val">260</span></label>
            <input type="range" id="count" min="40" max="700" step="10" value="260">
        </div>

        <div class="row">
            <label>Arc Speed <span class="val" id="speed-val">5</span></label>
            <input type="range" id="speed" min="1" max="18" value="5">
        </div>

        <div class="row">
            <label>Trail Length <span class="val" id="trail-val">35</span></label>
            <input type="range" id="trailLen" min="5" max="90" value="35">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Spawn Width <span class="val" id="spawn-val">1.0</span></label>
            <input type="range" id="spawnWidth" min="0.3" max="1.6" step="0.05" value="1.0">
        </div>

        <div class="row">
            <label>Curvature <span class="val" id="curve-val">1.2</span></label>
            <input type="range" id="curvature" min="0.2" max="3.0" step="0.1" value="1.2">
        </div>

        <div class="row">
            <label>Background Fade <span class="val" id="fade-val">18</span></label>
            <input type="range" id="bgFade" min="5" max="60" value="18">
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const gui = {
        color:      document.getElementById('color'),
        hglow:      document.getElementById('hglow'),
        count:      document.getElementById('count'),
        speed:      document.getElementById('speed'),
        trailLen:   document.getElementById('trailLen'),
        spawnWidth: document.getElementById('spawnWidth'),
        curvature:  document.getElementById('curvature'),
        bgFade:     document.getElementById('bgFade'),
    };

    let width, height;
    let streaks = [];

    function hexToRgb(hex) {
        return [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16),
        ];
    }

    class Streak {
        constructor(init = false) {
            this.spawn(init);
        }

        spawn(init = false) {
            const cx = width / 2;
            const cy = height / 2;
            const spd = parseFloat(gui.speed.value) / 5;
            const sw  = parseFloat(gui.spawnWidth.value);

            // Random position along center horizon line
            this.x = cx + (Math.random() - 0.5) * width * sw;
            this.y = cy;

            // Symmetric: half go up, half go down
            this.dir = Math.random() < 0.5 ? -1 : 1;

            // Horizontal velocity: proportional to x-offset from center
            // This creates the natural perspective convergence / fan effect
            const distX = this.x - cx;
            this.vx = distX * 0.007 * spd;

            // Vertical velocity: initial push away from horizon
            this.vy = this.dir * (Math.random() * 0.9 + 0.4) * spd;

            // Constant vertical acceleration (arc curving away from horizon)
            this.grav = this.dir * 0.028 * spd * parseFloat(gui.curvature.value);

            this.trail = [];
            this.alpha  = Math.random() * 0.55 + 0.35;
            this.lw     = Math.random() * 1.1 + 0.15;
            this.life   = 0;
            this.maxLife = parseInt(gui.trailLen.value) + Math.floor(Math.random() * 110 + 50);

            if (init) {
                // Pre-advance so particles are evenly distributed at startup
                const steps = Math.floor(Math.random() * (this.maxLife - 5));
                for (let i = 0; i < steps; i++) {
                    this.vx  += this.vx * 0.011;
                    this.vy  += this.grav;
                    this.x   += this.vx;
                    this.y   += this.vy;
                }
                this.life = steps;
            }
        }

        update() {
            const tl = parseInt(gui.trailLen.value);
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > tl) this.trail.shift();

            // Horizontal: multiplicative acceleration (natural arc curvature)
            this.vx += this.vx * 0.011;
            // Vertical: constant gravity away from horizon
            this.vy += this.grav;

            this.x += this.vx;
            this.y += this.vy;
            this.life++;

            const m = 0.18;
            if (this.life > this.maxLife ||
                this.y < -height * m || this.y > height * (1 + m) ||
                this.x < -width  * m || this.x > width  * (1 + m)) {
                this.spawn(false);
            }
        }

        draw(r, g, b) {
            if (this.trail.length < 2) return;
            const pts = [...this.trail, { x: this.x, y: this.y }];
            const n = pts.length;

            ctx.lineCap = 'round';
            for (let i = 1; i < n; i++) {
                const prog = i / n;
                ctx.beginPath();
                ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
                ctx.lineTo(pts[i].x, pts[i].y);
                ctx.strokeStyle = `rgba(${r},${g},${b},${(prog * this.alpha).toFixed(3)})`;
                ctx.lineWidth = this.lw * (prog * 0.65 + 0.15);
                ctx.stroke();
            }

            // Bright head point
            const head = pts[n - 1];
            ctx.beginPath();
            ctx.arc(head.x, head.y, this.lw * 1.6, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(220,235,255,${(this.alpha * 0.8).toFixed(3)})`;
            ctx.fill();
        }
    }

    function initStreaks() {
        const count = parseInt(gui.count.value);
        streaks = Array.from({ length: count }, () => new Streak(true));
    }

    function resize() {
        width  = canvas.width  = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStreaks();
    }

    function drawBackground() {
        const fade = parseInt(gui.bgFade.value) / 100;
        // Fade toward dark navy rather than pure black for atmospheric blue
        ctx.fillStyle = `rgba(0, 8, 26, ${fade})`;
        ctx.fillRect(0, 0, width, height);
    }

    function drawHorizon() {
        const cx = width / 2;
        const cy = height / 2;
        const g  = parseInt(gui.hglow.value);

        ctx.save();

        // Full-width glow line — bright white at center, fading to deep blue at edges
        const lg = ctx.createLinearGradient(0, 0, width, 0);
        lg.addColorStop(0,    'rgba(10, 40, 140, 0)');
        lg.addColorStop(0.28, 'rgba(50, 120, 255, 0.30)');
        lg.addColorStop(0.46, 'rgba(160, 210, 255, 0.75)');
        lg.addColorStop(0.5,  'rgba(255, 255, 255, 1.00)');
        lg.addColorStop(0.54, 'rgba(160, 210, 255, 0.75)');
        lg.addColorStop(0.72, 'rgba(50, 120, 255, 0.30)');
        lg.addColorStop(1,    'rgba(10, 40, 140, 0)');

        if (g > 0) {
            ctx.shadowBlur  = g * 1.2;
            ctx.shadowColor = '#3080ff';
        }
        ctx.beginPath();
        ctx.moveTo(0, cy);
        ctx.lineTo(width, cy);
        ctx.strokeStyle = lg;
        ctx.lineWidth   = 1.8;
        ctx.stroke();

        ctx.shadowBlur = 0;

        // Lens-flare radial glow at center vanishing point
        if (g > 0) {
            const r = 220 * (g / 40);
            const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            const a = g / 40;
            rg.addColorStop(0,    `rgba(255, 255, 255, ${a * 0.90})`);
            rg.addColorStop(0.04, `rgba(200, 225, 255, ${a * 0.70})`);
            rg.addColorStop(0.12, `rgba(90, 160, 255, ${a * 0.30})`);
            rg.addColorStop(0.35, `rgba(20, 60, 200, ${a * 0.08})`);
            rg.addColorStop(1,    'rgba(0, 0, 0, 0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            // Tiny hard white dot at center
            ctx.beginPath();
            ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${a})`;
            ctx.fill();
        }

        ctx.restore();
    }

    function animate() {
        drawBackground();

        // Sync particle count
        const count = parseInt(gui.count.value);
        while (streaks.length < count) streaks.push(new Streak(true));
        while (streaks.length > count) streaks.pop();

        const [r, g, b] = hexToRgb(gui.color.value);
        streaks.forEach(s => { s.update(); s.draw(r, g, b); });

        // Draw horizon on top so glow overlays the arcs
        drawHorizon();

        requestAnimationFrame(animate);
    }

    // Panel toggle
    const panel     = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    // Live value readouts
    [['hglow','hglow-val'],['count','count-val'],['speed','speed-val'],
     ['trailLen','trail-val'],['spawnWidth','spawn-val'],
     ['curvature','curve-val'],['bgFade','fade-val']
    ].forEach(([id, valId]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(valId).textContent = e.target.value;
        });
    });

    window.addEventListener('resize', resize);
    resize();
    animate();

    // Cycling rainbow accent for controls UI
    let _accentHue = Math.random() * 360;
    (function cycleAccent() {
        _accentHue = (_accentHue + 0.18) % 360;
        const accent = `hsl(${_accentHue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', accent);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = accent);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
