<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typographic Fluidity</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed;
            right: 0; top: 0;
            height: 100vh;
            width: 270px;
            background: rgba(5, 5, 5, 0.93);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(12, 12, 12, 0.88);
            border: 1px solid var(--accent);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }

        .row { margin-bottom: 18px; }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
            color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        input[type="text"] {
            width: 100%;
            background: #151515;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 9px 10px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: monospace;
            outline: none;
        }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none;
            border-radius: 5px; flex-shrink: 0;
        }
        .color-hint { font-size: 11px; color: #555; }

        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Characters / Text</label>
            <input type="text" id="textInput" value="GEMINI">
        </div>

        <div class="row">
            <label>Color</label>
            <div class="flex-row">
                <input type="color" id="color" value="#ffffff">
                <span class="color-hint">Glyph color & glow</span>
            </div>
        </div>

        <div class="row">
            <label>Glow Intensity <span class="val" id="glow-val">0</span></label>
            <input type="range" id="glowIntensity" min="0" max="25" value="0">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Font Size <span class="val" id="size-val">24</span></label>
            <input type="range" id="fontSize" min="10" max="60" value="24">
        </div>

        <div class="row">
            <label>Grid Density <span class="val" id="grid-val">40</span></label>
            <input type="range" id="gridSize" min="20" max="100" value="40">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Drift Amount <span class="val" id="drift-val">50</span></label>
            <input type="range" id="drift" min="0" max="100" value="50">
        </div>

        <div class="row">
            <label>Flow Speed <span class="val" id="speed-val">15</span></label>
            <input type="range" id="speed" min="1" max="50" value="15">
        </div>

        <div class="row">
            <label>Trail Persistence <span class="val" id="trail-val">20</span></label>
            <input type="range" id="trail" min="5" max="80" value="20">
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const simplex = new SimplexNoise();

    const gui = {
        text:  document.getElementById('textInput'),
        color: document.getElementById('color'),
        glow:  document.getElementById('glowIntensity'),
        size:  document.getElementById('fontSize'),
        grid:  document.getElementById('gridSize'),
        drift: document.getElementById('drift'),
        speed: document.getElementById('speed'),
        trail: document.getElementById('trail'),
    };

    // Live value readouts
    [['glowIntensity','glow-val'],['fontSize','size-val'],
     ['gridSize','grid-val'],['drift','drift-val'],
     ['speed','speed-val'],['trail','trail-val']
    ].forEach(([id, valId]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(valId).textContent = e.target.value;
        });
    });

    // Panel toggle
    const panel = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    let width, height, z = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    function animate() {
        const trailAlpha = parseInt(gui.trail.value) / 100;
        ctx.fillStyle = `rgba(0,0,0,${trailAlpha})`;
        ctx.fillRect(0, 0, width, height);

        const color = gui.color.value;
        const fontSize = parseInt(gui.size.value);
        const spacing = parseInt(gui.grid.value);
        const inputText = gui.text.value || ' ';
        const driftScale = parseInt(gui.drift.value) / 100;
        const zoom = 500;

        ctx.font = `bold ${fontSize}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;

        const glowAmt = parseInt(gui.glow.value);
        ctx.shadowBlur = glowAmt;
        ctx.shadowColor = glowAmt > 0 ? color : 'transparent';

        let charIndex = 0;

        for (let x = spacing / 2; x < width + spacing; x += spacing) {
            for (let y = spacing / 2; y < height + spacing; y += spacing) {
                const n = simplex.noise3D(x / zoom, y / zoom, z);
                const driftX = simplex.noise3D(x / zoom + 100, y / zoom, z) * spacing * driftScale;
                const driftY = simplex.noise3D(x / zoom, y / zoom + 100, z) * spacing * driftScale;

                ctx.save();
                ctx.translate(x + driftX, y + driftY);
                ctx.rotate(n * Math.PI);

                const char = inputText[charIndex % inputText.length];
                ctx.fillText(char, 0, 0);
                ctx.restore();

                charIndex++;
            }
        }

        z += gui.speed.value * 0.0005;
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();

    // Cycling rainbow accent for controls UI
    let _accentHue = Math.random() * 360;
    (function cycleAccent() {
        _accentHue = (_accentHue + 0.18) % 360;
        const accent = `hsl(${_accentHue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', accent);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = accent);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
