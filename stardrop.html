<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Stars</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #060826; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed; right: 0; top: 0;
            height: 100vh; width: 270px;
            background: rgba(4, 5, 25, 0.96);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100; overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed; right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(4, 5, 25, 0.9);
            border: 1px solid var(--accent); border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 101; font-size: 20px; line-height: 1; padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }
        .row { margin-bottom: 18px; }
        label {
            display: flex; justify-content: space-between;
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 7px; color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none; border-radius: 5px; flex-shrink: 0;
        }
        .color-hint { font-size: 11px; color: #555; }
        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 18px 0; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Background Color</label>
            <div class="flex-row">
                <input type="color" id="bgColor" value="#060826">
                <span class="color-hint">Sky background</span>
            </div>
        </div>

        <div class="row">
            <label>Ground / Lights Color</label>
            <div class="flex-row">
                <input type="color" id="groundColor" value="#4477ff">
                <span class="color-hint">Ground line &amp; rays</span>
            </div>
        </div>

        <hr class="sep">

        <div class="row">
            <label>Star Color</label>
            <div class="flex-row">
                <input type="color" id="starColor" value="#dde8ff">
                <span class="color-hint">Primary stars</span>
            </div>
        </div>
        <div class="row">
            <label>Accent Color</label>
            <div class="flex-row">
                <input type="color" id="accentColor" value="#ffd060">
                <span class="color-hint">Gold stars</span>
            </div>
        </div>

        <div class="row">
            <label>Gold Ratio % <span class="val" id="gold-val">28</span></label>
            <input type="range" id="goldRatio" min="0" max="100" value="28">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Star Count <span class="val" id="count-val">280</span></label>
            <input type="range" id="starCount" min="50" max="700" step="10" value="280">
        </div>

        <div class="row">
            <label>Fall Speed <span class="val" id="speed-val">5</span></label>
            <input type="range" id="fallSpeed" min="1" max="18" value="5">
        </div>

        <div class="row">
            <label>Max Star Size <span class="val" id="size-val">22</span></label>
            <input type="range" id="maxSize" min="6" max="40" value="22">
        </div>

        <div class="row">
            <label>Star Glow <span class="val" id="glow-val">0</span></label>
            <input type="range" id="starGlow" min="0" max="25" value="0">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Ray Intensity <span class="val" id="ray-val">8</span></label>
            <div class="flex-row">
                <input type="range" id="rayInt" min="0" max="20" value="8" style="flex:1">
                <label style="margin:0; font-size:11px; color:#666; gap:6px; text-transform:none; letter-spacing:0;">
                    <input type="checkbox" id="raysOn" checked style="width:14px;height:14px;cursor:pointer;accent-color:#fff;margin:0;">
                    On
                </label>
            </div>
        </div>

        <div class="row">
            <label>Ground Glow <span class="val" id="gglow-val">0</span></label>
            <input type="range" id="groundGlow" min="0" max="35" value="0">
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    const gui = {
        bgColor:    document.getElementById('bgColor'),
        groundColor:document.getElementById('groundColor'),
        starColor:  document.getElementById('starColor'),
        accentColor:document.getElementById('accentColor'),
        goldRatio:  document.getElementById('goldRatio'),
        starCount:  document.getElementById('starCount'),
        fallSpeed:  document.getElementById('fallSpeed'),
        maxSize:    document.getElementById('maxSize'),
        starGlow:   document.getElementById('starGlow'),
        rayInt:     document.getElementById('rayInt'),
        raysOn:     document.getElementById('raysOn'),
        groundGlow: document.getElementById('groundGlow'),
    };

    const GROUND = 0.855; // ground line as fraction of screen height

    let width, height, time = 0;
    let stars = [], rays = [];

    // ── helpers ──────────────────────────────────────────────────────────────

    function hexRgb(hex) {
        return [
            parseInt(hex.slice(1,3), 16),
            parseInt(hex.slice(3,5), 16),
            parseInt(hex.slice(5,7), 16),
        ];
    }

    // Trace a 5-pointed star path centred at (0,0)
    function starPath(outerR, innerR) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r     = i % 2 === 0 ? outerR : innerR;
            const angle = (i * Math.PI / 5) - Math.PI / 2; // point up
            if (i === 0) ctx.moveTo(r * Math.cos(angle), r * Math.sin(angle));
            else         ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
        }
        ctx.closePath();
    }

    // ── light rays ───────────────────────────────────────────────────────────

    class LightRay {
        constructor() {
            this.x     = (0.1 + Math.random() * 0.8) * width;
            this.hw    = (0.03 + Math.random() * 0.07) * width;
            this.phase = Math.random() * Math.PI * 2;
            this.base  = Math.random() * 0.08 + 0.03;
        }

        draw(r, g, b) {
            const intensity = parseInt(gui.rayInt.value);
            if (intensity === 0 || !gui.raysOn.checked) return;
            const a = (this.base * intensity / 20) * (0.55 + 0.45 * Math.sin(time * 0.7 + this.phase));
            const groundY = height * GROUND;

            const grad = ctx.createLinearGradient(this.x, 0, this.x, groundY);
            grad.addColorStop(0,   `rgba(${r},${g},${b},${a})`);
            grad.addColorStop(0.55,`rgba(${r},${g},${b},${(a * 0.3).toFixed(3)})`);
            grad.addColorStop(1,   'rgba(0,0,0,0)');

            ctx.beginPath();
            ctx.moveTo(this.x - this.hw,         0);
            ctx.lineTo(this.x + this.hw,         0);
            ctx.lineTo(this.x + this.hw * 3.5,   groundY);
            ctx.lineTo(this.x - this.hw * 3.5,   groundY);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
        }
    }

    // ── star path (neonfall-style bezier arc at ground line) ─────────────────

    const FLOOR_T = 0.74; // fraction of path spent falling before arc begins

    function getStarPos(startX, s) {
        const groundY = height * GROUND;
        const hw      = width * 0.5;
        const dx      = startX - hw;
        const absDx   = Math.abs(dx);
        const sign    = dx >= 0 ? 1 : -1;

        // 55% convergence toward center — creates a dramatic arc at the floor
        const floorX = hw + dx * 0.45;
        const floorY = groundY;

        // After arc: glide outward ALONG the ground level (exitY = floorY)
        const push  = Math.max(absDx, hw * 0.20);
        const exitX = floorX + sign * push * 2.6;
        const exitY = floorY; // stay at ground level — visible gliding

        const sc = Math.max(0, Math.min(1, s));

        if (sc <= FLOOR_T) {
            const u  = sc / FLOOR_T;
            const eu = u * u * (3 - 2 * u); // smoothstep
            const cpX = startX * 0.50 + floorX * 0.50;
            const cpY = floorY * 0.22;
            return {
                x: (1-eu)*(1-eu)*startX + 2*(1-eu)*eu*cpX + eu*eu*floorX,
                y: (1-eu)*(1-eu)*(-30)  + 2*(1-eu)*eu*cpY + eu*eu*floorY,
            };
        } else {
            const u  = (sc - FLOOR_T) / (1 - FLOOR_T);
            const eu = u * u * (3 - 2 * u);
            // Control point stays at ground level → purely horizontal slide
            const cpX = floorX + sign * push * 1.0;
            const cpY = floorY;
            return {
                x: (1-eu)*(1-eu)*floorX + 2*(1-eu)*eu*cpX + eu*eu*exitX,
                y: (1-eu)*(1-eu)*floorY + 2*(1-eu)*eu*cpY + eu*eu*exitY,
            };
        }
    }

    // ── falling star ─────────────────────────────────────────────────────────

    class FallingStar {
        constructor(init = false) { this.spawn(init); }

        spawn(init = false) {
            const maxSz   = parseInt(gui.maxSize.value);
            this.size     = Math.random() * (maxSz - 4) + 4;
            this.innerR   = this.size * 0.42;
            this.startX   = (Math.random() * 1.06 - 0.03) * width;
            this.baseSpd  = 0.0022 + Math.random() * 0.0030;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpd   = (Math.random() - 0.5) * 0.022;
            this.curAlpha = Math.random() * 0.45 + 0.45;
            this.isGold   = Math.random() * 100 < parseInt(gui.goldRatio.value);
            this.twPhase  = Math.random() * Math.PI * 2;
            this.twSpeed  = 0.025 + Math.random() * 0.04;
            this.t        = init ? Math.random() : 0; // distribute on init
        }

        update() {
            const spd     = parseFloat(gui.fallSpeed.value) / 5;
            this.t        += this.baseSpd * spd;
            this.rotation += this.rotSpd;
            this.twPhase  += this.twSpeed;
            if (this.t > 1.08) this.spawn(false);
        }

        _draw(r, g, b, r2, g2, b2, alpha, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.rotation);
            starPath(this.size, this.innerR);
            ctx.fillStyle = this.isGold
                ? `rgba(${r2},${g2},${b2},${alpha.toFixed(3)})`
                : `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
            ctx.fill();
            ctx.restore();
        }

        drawBase(r, g, b, r2, g2, b2) {
            if (this.curAlpha <= 0 || this.t <= 0) return;
            const pos = getStarPos(this.startX, Math.min(this.t, 1));
            const tw  = 0.72 + 0.28 * Math.sin(this.twPhase);
            this._draw(r, g, b, r2, g2, b2, this.curAlpha * tw, pos);
        }

        drawGlow(r, g, b, r2, g2, b2) {
            if (this.curAlpha <= 0 || this.size < 10 || this.t <= 0) return;
            const pos = getStarPos(this.startX, Math.min(this.t, 1));
            const tw  = 0.72 + 0.28 * Math.sin(this.twPhase);
            this._draw(r, g, b, r2, g2, b2, this.curAlpha * tw, pos);
        }
    }

    // ── scene drawing ─────────────────────────────────────────────────────────

    function drawBackground(sr, sg, sb, bgR, bgG, bgB) {
        // Motion trail using background color
        ctx.fillStyle = `rgba(${bgR},${bgG},${bgB},0.32)`;
        ctx.fillRect(0, 0, width, height);

        // Top-centre ambient glow from star color
        const cx = width / 2;
        const tg = ctx.createRadialGradient(cx, -height * 0.05, 0, cx, -height * 0.05, height * 0.9);
        tg.addColorStop(0,   `rgba(${sr},${sg},${sb},0.14)`);
        tg.addColorStop(0.35,`rgba(${Math.floor(sr*0.5)},${Math.floor(sg*0.5)},${Math.floor(sb*0.6)},0.05)`);
        tg.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = tg;
        ctx.fillRect(0, 0, width, height);
    }

    function drawGround(r, g, b) {
        const groundY = height * GROUND;
        const gAmt    = parseInt(gui.groundGlow.value);

        // Ground surface fill — dark, tinted with ground color
        const gg = ctx.createLinearGradient(0, groundY, 0, height);
        gg.addColorStop(0, `rgba(${Math.floor(r*0.18)},${Math.floor(g*0.18)},${Math.floor(b*0.3)},0.95)`);
        gg.addColorStop(1, `rgba(${Math.floor(r*0.04)},${Math.floor(g*0.04)},${Math.floor(b*0.1)},1)`);
        ctx.fillStyle = gg;
        ctx.fillRect(0, groundY, width, height - groundY);

        if (gAmt > 0) {
            const a = gAmt / 35;

            // Glowing ground line
            ctx.save();
            ctx.shadowBlur  = gAmt;
            ctx.shadowColor = `rgb(${r},${g},${b})`;
            ctx.fillStyle   = `rgba(255,255,255,${0.7 + a * 0.25})`;
            ctx.fillRect(0, groundY - 1.5, width, 3);
            ctx.restore();

            // Soft reflection under the line
            const ref = ctx.createLinearGradient(0, groundY, 0, groundY + 90);
            ref.addColorStop(0, `rgba(${r},${g},${b},${a * 0.3})`);
            ref.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = ref;
            ctx.fillRect(0, groundY + 3, width, 90);

            // Wide horizontal glow spread on the line
            const spread = ctx.createRadialGradient(width / 2, groundY, 0, width / 2, groundY, width * 0.55);
            spread.addColorStop(0,   `rgba(${r},${g},${b},${a * 0.18})`);
            spread.addColorStop(0.5, `rgba(${r},${g},${b},${a * 0.07})`);
            spread.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = spread;
            ctx.fillRect(0, groundY - 20, width, 40);
        } else {
            // Always draw a thin ground line even without glow
            ctx.fillStyle = `rgba(${r},${g},${b},0.5)`;
            ctx.fillRect(0, groundY - 1, width, 2);
        }
    }

    function drawStars(r, g, b, r2, g2, b2) {
        const glowAmt = parseInt(gui.starGlow.value);

        // Pass 1: all stars, no shadow (fast)
        stars.forEach(s => s.drawBase(r, g, b, r2, g2, b2));

        // Pass 2: only larger stars get glow — batch by color to minimise shadow state changes
        if (glowAmt > 0) {
            ctx.save();
            ctx.shadowBlur  = glowAmt;
            ctx.shadowColor = `rgb(${r},${g},${b})`;
            stars.filter(s => !s.isGold && s.size >= 10).forEach(s => s.drawGlow(r, g, b, r2, g2, b2));
            ctx.restore();

            ctx.save();
            ctx.shadowBlur  = glowAmt;
            ctx.shadowColor = `rgb(${r2},${g2},${b2})`;
            stars.filter(s => s.isGold && s.size >= 10).forEach(s => s.drawGlow(r, g, b, r2, g2, b2));
            ctx.restore();
        }
    }

    // ── init & lifecycle ──────────────────────────────────────────────────────

    function buildRays() {
        rays = Array.from({ length: 6 }, () => new LightRay());
    }

    function syncStarCount() {
        const n = parseInt(gui.starCount.value);
        while (stars.length < n) stars.push(new FallingStar(false));
        while (stars.length > n) stars.pop();
    }

    function resize() {
        width  = canvas.width  = window.innerWidth;
        height = canvas.height = window.innerHeight;
        stars  = Array.from({ length: parseInt(gui.starCount.value) }, () => new FallingStar(true));
        buildRays();
    }

    // ── animate ───────────────────────────────────────────────────────────────

    function animate() {
        const [sr, sg, sb]   = hexRgb(gui.starColor.value);
        const [r2, g2, b2]   = hexRgb(gui.accentColor.value);
        const [bgR, bgG, bgB] = hexRgb(gui.bgColor.value);
        const [gr, gg, gb]   = hexRgb(gui.groundColor.value);

        drawBackground(sr, sg, sb, bgR, bgG, bgB);

        // Light rays behind everything
        rays.forEach(ray => ray.draw(gr, gg, gb));

        // Ground drawn first — stars then render ON TOP of the ground surface,
        // visibly gliding across it after the floor arc
        drawGround(gr, gg, gb);

        // Stars drawn on top — sliding stars are fully visible at ground level
        syncStarCount();
        stars.forEach(s => s.update());
        drawStars(sr, sg, sb, r2, g2, b2);

        time += 0.016;
        requestAnimationFrame(animate);
    }

    // ── panel ─────────────────────────────────────────────────────────────────

    const panel     = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    // Update body background when color changes so no flash
    gui.bgColor.addEventListener('input', () => {
        document.body.style.backgroundColor = gui.bgColor.value;
    });

    [['goldRatio','gold-val'],['starCount','count-val'],['fallSpeed','speed-val'],
     ['maxSize','size-val'],['starGlow','glow-val'],['rayInt','ray-val'],['groundGlow','gglow-val']
    ].forEach(([id, vid]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(vid).textContent = e.target.value;
        });
    });

    window.addEventListener('resize', resize);
    resize();
    animate();

    // Cycling rainbow accent for controls UI
    let _accentHue = Math.random() * 360;
    (function cycleAccent() {
        _accentHue = (_accentHue + 0.18) % 360;
        const accent = `hsl(${_accentHue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', accent);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = accent);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
