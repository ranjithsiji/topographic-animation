<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Driving Home (CSS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">


<style>
*, *::before, *::after {
  font-family: inherit;
  box-sizing: inherit;
  margin: 0;
  padding: 0;
}

html {
  box-sizing: border-box;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 62.5%;
}

html body {
  font-size: 1.6rem;
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

ul {
  list-style: none;
}

a, a:link, a:visited {
  text-decoration: none;
}

@font-face {
  font-family: 'icomoon';
  src:  url('https://assets.codepen.io/2509128/icomoon.eot?bxxefg');
  src:  url('https://assets.codepen.io/2509128/icomoon.eot?bxxefg#iefix') format('embedded-opentype'),
    url('https://assets.codepen.io/2509128/icomoon.ttf?bxxefg') format('truetype'),
    url('https://assets.codepen.io/2509128/icomoon.woff?bxxefg') format('woff'),
    url('https://assets.codepen.io/2509128/icomoon.svg?bxxefg#icomoon') format('svg');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}

[class^="icon-"], [class*=" icon-"] {
  /* use !important to prevent issues with browser extensions that change fonts */
  font-family: 'icomoon' !important;
  speak: never;
  font-style: normal;
  font-weight: normal;
  font-variant: normal;
  text-transform: none;
  line-height: 1;

  /* Better Font Rendering =========== */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.icon-star-full:before {
  content: "\e900";
}
.icon-star-empty:before {
  content: "\e901";
}

</style><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
	<div class="street-lamps">
		<div class="street-lamp"></div>
		<div class="street-lamp"></div>
		<div class="street-lamp"></div>
		<div class="street-lamp"></div>
		<div class="street-lamp"></div>
	</div>
	
	<div class="cars-incoming">
		<div class="car"></div>
		<div class="car"></div>
		<div class="car"></div>
		<span class="reflect"></span>
		<span class="reflect"></span>
		<span class="reflect"></span>
	</div>
	
	<div class="cars-going">
		<div class="car"></div>
		<span class="reflect"></span>
	</div>
	
	<div class="cars-going-flash">
		<div class="car"></div>
		<span class="reflect"></span>
	</div>
	
	<div class="city-lights">
		<div class="light"></div>
		<div class="light"></div>
		<div class="light"></div>
		<div class="light"></div>
		<div class="light"></div>
	</div>
</div>
    
  </body>
  
</html>
