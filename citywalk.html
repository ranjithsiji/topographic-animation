<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon City Walk</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #05030f; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed; right: 0; top: 0;
            height: 100vh; width: 270px;
            background: rgba(5, 3, 15, 0.96);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100; overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed; right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(5, 3, 15, 0.9);
            border: 1px solid var(--accent); border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 101; font-size: 20px; line-height: 1; padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }
        .row { margin-bottom: 18px; }
        label {
            display: flex; justify-content: space-between;
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 7px; color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none; border-radius: 5px; flex-shrink: 0;
        }
        .color-hint { font-size: 11px; color: #555; }
        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 18px 0; }
        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: #888; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer; user-select: none;
        }
        .toggle-row input[type="checkbox"] {
            appearance: none; -webkit-appearance: none;
            width: 32px; height: 18px; background: #222;
            border-radius: 9px; position: relative; cursor: pointer;
            transition: background 0.2s; flex-shrink: 0; margin: 0;
        }
        .toggle-row input[type="checkbox"]::after {
            content: ""; position: absolute;
            width: 14px; height: 14px; background: #888;
            border-radius: 50%; top: 2px; left: 2px;
            transition: left 0.2s, background 0.2s;
        }
        .toggle-row input[type="checkbox"]:checked { background: var(--accent); }
        .toggle-row input[type="checkbox"]:checked::after { left: 16px; background: white; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Background</label>
            <div class="flex-row">
                <input type="color" id="bgColor" value="#05030f">
                <span class="color-hint">Sky / night</span>
            </div>
        </div>

        <div class="row">
            <label>Road Color</label>
            <div class="flex-row">
                <input type="color" id="roadColor" value="#0a0814">
                <span class="color-hint">Asphalt</span>
            </div>
        </div>

        <div class="row">
            <label>Building Color</label>
            <div class="flex-row">
                <input type="color" id="buildingColor" value="#0d0820">
                <span class="color-hint">Block fill</span>
            </div>
        </div>

        <hr class="sep">

        <div class="row">
            <label>Neon A (Pink)</label>
            <div class="flex-row">
                <input type="color" id="neonA" value="#ff2eb4">
                <span class="color-hint">Magenta lines</span>
            </div>
        </div>

        <div class="row">
            <label>Neon B (Cyan)</label>
            <div class="flex-row">
                <input type="color" id="neonB" value="#26e3ff">
                <span class="color-hint">Cyan lines</span>
            </div>
        </div>

        <div class="row">
            <label>Neon C (Orange)</label>
            <div class="flex-row">
                <input type="color" id="neonC" value="#ff9620">
                <span class="color-hint">Accent lines</span>
            </div>
        </div>

        <div class="row">
            <label>Lamp Color</label>
            <div class="flex-row">
                <input type="color" id="lampColor" value="#ffd06a">
                <span class="color-hint">Street lamps</span>
            </div>
        </div>

        <hr class="sep">

        <div class="row">
            <label>Walk Speed <span class="val" id="speed-val">14</span></label>
            <input type="range" id="walkSpeed" min="1" max="60" value="14">
        </div>

        <div class="row">
            <label>Building Density <span class="val" id="density-val">14</span></label>
            <input type="range" id="density" min="4" max="30" value="14">
        </div>

        <div class="row">
            <label>Street Width <span class="val" id="width-val">90</span></label>
            <input type="range" id="streetWidth" min="40" max="160" value="90">
        </div>

        <div class="row">
            <label>Building Height <span class="val" id="bheight-val">40</span></label>
            <input type="range" id="buildingHeight" min="15" max="120" value="40">
        </div>

        <div class="row">
            <label>Lamp Spacing <span class="val" id="lamp-val">3</span></label>
            <input type="range" id="lampSpacing" min="1" max="8" value="3">
        </div>

        <div class="row">
            <label>Neon Glow <span class="val" id="glow-val">14</span></label>
            <input type="range" id="neonGlow" min="0" max="40" value="14">
        </div>

        <div class="row">
            <label>Horizon % <span class="val" id="hz-val">55</span></label>
            <input type="range" id="horizon" min="30" max="75" value="55">
        </div>

        <div class="row">
            <label>Fog Intensity <span class="val" id="fog-val">55</span></label>
            <input type="range" id="fog" min="0" max="100" value="55">
        </div>

        <hr class="sep">

        <div class="row">
            <label class="toggle-row">
                <span>Side Buildings</span>
                <input type="checkbox" id="sideBuildings" checked>
            </label>
        </div>

        <div class="row">
            <label class="toggle-row">
                <span>Horizon Landmark</span>
                <input type="checkbox" id="landmark" checked>
            </label>
        </div>

        <div class="row">
            <label class="toggle-row">
                <span>Moon</span>
                <input type="checkbox" id="showMoon" checked>
            </label>
        </div>

        <div class="row">
            <label class="toggle-row">
                <span>Moon Glow</span>
                <input type="checkbox" id="moonGlow" checked>
            </label>
        </div>

        <div class="row">
            <label>Moon Color</label>
            <div class="flex-row">
                <input type="color" id="moonColor" value="#f4eccb">
                <span class="color-hint">Disc colour</span>
            </div>
        </div>

        <div class="row">
            <label class="toggle-row">
                <span>Stars</span>
                <input type="checkbox" id="showStars" checked>
            </label>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    const gui = {
        bgColor:        document.getElementById('bgColor'),
        roadColor:      document.getElementById('roadColor'),
        buildingColor:  document.getElementById('buildingColor'),
        neonA:          document.getElementById('neonA'),
        neonB:          document.getElementById('neonB'),
        neonC:          document.getElementById('neonC'),
        lampColor:      document.getElementById('lampColor'),
        walkSpeed:      document.getElementById('walkSpeed'),
        density:        document.getElementById('density'),
        streetWidth:    document.getElementById('streetWidth'),
        buildingHeight: document.getElementById('buildingHeight'),
        lampSpacing:    document.getElementById('lampSpacing'),
        neonGlow:       document.getElementById('neonGlow'),
        horizon:        document.getElementById('horizon'),
        fog:            document.getElementById('fog'),
        sideBuildings:  document.getElementById('sideBuildings'),
        landmark:       document.getElementById('landmark'),
        showMoon:       document.getElementById('showMoon'),
        moonGlow:       document.getElementById('moonGlow'),
        moonColor:      document.getElementById('moonColor'),
        showStars:      document.getElementById('showStars'),
    };

    let width, height;
    let buildings = [];   // [{side:-1|1, z, w, h, depth, neonIdx, stripes}]
    let lamps     = [];   // [{side:-1|1, z}]
    let stars     = [];   // [{xFrac, yFrac, r, alpha}]
    let horizonBldgs = []; // [{side, offUnits, wUnits, hFactor, neonIdx, stripeYs}]
    let cameraZ   = 0;    // forward travel distance
    const FAR_Z   = 200;  // furthest z spawned
    const NEAR_Z  = -3;   // recycle when behind camera
    const FOV     = 320;  // perspective focal length factor

    // ── helpers ──────────────────────────────────────────────────────────────
    function hexRgb(hex) {
        return [
            parseInt(hex.slice(1,3),16),
            parseInt(hex.slice(3,5),16),
            parseInt(hex.slice(5,7),16),
        ];
    }

    // perspective project (cx, cy, fov) → screen point + scale
    function project(x, y, z) {
        const cz = z - cameraZ;
        if (cz <= 0.05) return null;
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy = height * horizonPct;
        const k  = FOV / cz;
        return {
            sx: width * 0.5 + x * k,
            sy: hy + y * k,
            k,
            cz,
        };
    }

    // ── content generation ──────────────────────────────────────────────────
    function makeStripes(maxFloors) {
        const floors = 3 + (Math.random() * (maxFloors - 3) | 0);
        const out = [];
        for (let i = 1; i <= floors; i++) {
            out.push({
                yFrac: i / (floors + 1),
                colorIdx: (Math.random() * 3) | 0,
            });
        }
        return out;
    }

    // sidewalk width sits between road edge and building inner face
    const SIDEWALK = 10;

    function spawnBuilding(side, z) {
        const baseH = parseInt(gui.buildingHeight.value);
        const sw    = parseInt(gui.streetWidth.value);
        const w     = 14 + Math.random() * 14;
        const h     = baseH * (0.55 + Math.random() * 0.9);
        const d     = 10 + Math.random() * 14;
        return {
            side, z, w, h, d,
            neonIdx: (Math.random() * 3) | 0,
            stripes: makeStripes(6),
            xOffset: sw + SIDEWALK,
        };
    }

    function spawnLamp(side, z) {
        return { side, z };
    }

    function buildScene() {
        buildings = [];
        lamps     = [];
        const density = parseInt(gui.density.value);
        const lampSp  = parseInt(gui.lampSpacing.value);
        const step    = 200 / density;

        for (let i = 0; i < density; i++) {
            const z = i * step + Math.random() * step * 0.3;
            buildings.push(spawnBuilding(-1, z));
            buildings.push(spawnBuilding( 1, z + step * 0.5));
        }

        const lampStep = step * lampSp / 3;
        for (let z = 1, i = 0; z < FAR_Z; z += lampStep, i++) {
            lamps.push(spawnLamp(-1, z));
            lamps.push(spawnLamp( 1, z + lampStep * 0.5));
        }

        // procedural stars (fixed in sky)
        stars = [];
        const N = 90;
        for (let i = 0; i < N; i++) {
            stars.push({
                xFrac: Math.random(),
                yFrac: Math.random() * 0.55,             // upper half of canvas
                r:     0.5 + Math.random() * 1.4,
                alpha: 0.35 + Math.random() * 0.55,
                tw:    Math.random() * Math.PI * 2,
                twSp:  0.005 + Math.random() * 0.02,
            });
        }

        // horizon flanking buildings — fill the whole horizon both sides of landmark.
        // Coordinates are stored in "units" and resolved at draw time so they scale
        // with the canvas / horizon and stay deterministic across frames.
        horizonBldgs = [];
        for (const side of [-1, 1]) {
            // start past the triangle landmark (~3 units), march outward until far edge
            let off = 3;
            while (off < 40) {
                const w = 1.2 + Math.random() * 2.0;            // width in units
                // tall, mid, short — pick from a distribution biased to variety
                const hRoll = Math.random();
                let hF;
                if      (hRoll < 0.18) hF = 0.45 + Math.random() * 0.18;  // skyscraper
                else if (hRoll < 0.55) hF = 0.25 + Math.random() * 0.15;  // medium
                else                    hF = 0.10 + Math.random() * 0.13; // short
                const stripeCount = 2 + ((Math.random() * 3) | 0);
                const stripeYs = [];
                for (let i = 1; i <= stripeCount; i++) {
                    stripeYs.push(i / (stripeCount + 1) + (Math.random() - 0.5) * 0.04);
                }
                horizonBldgs.push({
                    side,
                    offUnits: off,
                    wUnits:   w,
                    hFactor:  hF,
                    neonIdx:  (Math.random() * 3) | 0,
                    stripeYs,
                });
                off += w + 0.15 + Math.random() * 0.4;          // small gap, sometimes touching
            }
        }
    }

    function recycle() {
        // Determine furthest existing z per category, push recycled to back
        const sw      = parseInt(gui.streetWidth.value);
        for (const b of buildings) {
            if (b.z - cameraZ < NEAR_Z) {
                let maxZ = b.z;
                for (const o of buildings) if (o.side === b.side && o.z > maxZ) maxZ = o.z;
                const density = parseInt(gui.density.value);
                const step    = 200 / density;
                b.z = maxZ + step * (0.7 + Math.random() * 0.6);
                b.w = 14 + Math.random() * 14;
                const baseH = parseInt(gui.buildingHeight.value);
                b.h = baseH * (0.55 + Math.random() * 0.9);
                b.d = 10 + Math.random() * 14;
                b.neonIdx = (Math.random() * 3) | 0;
                b.stripes = makeStripes(6);
                b.xOffset = sw + SIDEWALK;
            }
        }
        for (const l of lamps) {
            if (l.z - cameraZ < NEAR_Z) {
                let maxZ = l.z;
                for (const o of lamps) if (o.side === l.side && o.z > maxZ) maxZ = o.z;
                const lampSp = parseInt(gui.lampSpacing.value);
                const density = parseInt(gui.density.value);
                const lampStep = (200 / density) * lampSp / 3;
                l.z = maxZ + lampStep;
            }
        }
    }

    // ── drawing ──────────────────────────────────────────────────────────────
    function drawSky(bgR, bgG, bgB) {
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy = height * horizonPct;
        const g  = ctx.createLinearGradient(0, 0, 0, hy);
        g.addColorStop(0,    `rgb(${Math.max(0,bgR-4)},${Math.max(0,bgG-2)},${Math.min(255,bgB+18)})`);
        g.addColorStop(0.7,  `rgb(${bgR},${bgG},${Math.min(255,bgB+6)})`);
        g.addColorStop(1,    `rgb(${bgR},${bgG},${bgB})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, width, hy);

        // ground beyond the road: a darker sidewalk-tone band so the road polygon stands out
        ctx.fillStyle = `rgb(${Math.max(0,bgR+4)},${Math.max(0,bgG+4)},${Math.max(0,bgB+6)})`;
        ctx.fillRect(0, hy, width, height - hy);
    }

    function drawMoon(moonR, moonG, moonB) {
        if (!gui.showMoon.checked) return;
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy = height * horizonPct;
        const cx = width * 0.78;
        const cy = hy * 0.32;
        const r  = Math.min(width, height) * 0.045;

        // soft halo — independently toggled
        if (gui.moonGlow.checked) {
            const halo = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 4);
            halo.addColorStop(0,   `rgba(${moonR},${moonG},${moonB},0.35)`);
            halo.addColorStop(0.5, `rgba(${moonR},${moonG},${moonB},0.08)`);
            halo.addColorStop(1,   `rgba(0,0,0,0)`);
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // disc
        ctx.fillStyle = `rgb(${moonR},${moonG},${moonB})`;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawStars() {
        if (!gui.showStars.checked) return;
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy = height * horizonPct;
        for (const s of stars) {
            const sx = s.xFrac * width;
            const sy = s.yFrac * hy;
            s.tw += s.twSp;
            const a = s.alpha * (0.6 + 0.4 * Math.sin(s.tw));
            ctx.fillStyle = `rgba(235,240,255,${a.toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Permanent triangular landmark + flanking buildings at the vanishing point
    function drawLandmark(bldR, bldG, bldB, neons) {
        if (!gui.landmark.checked) return;
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy   = height * horizonPct;
        const cx   = width * 0.5;
        const glow = parseInt(gui.neonGlow.value);

        // ── flanking buildings — fill the whole horizon both sides of the landmark.
        // Generated once in buildScene() and stored in horizonBldgs.
        const baseY = hy + 2;
        const unitW = Math.max(8, Math.min(width, height) * 0.014);
        for (const b of horizonBldgs) {
            const bw  = b.wUnits * unitW;
            const bh  = hy * b.hFactor;
            // anchor outer edge of building based on offUnits running outward
            const x   = b.side === -1
                ? cx - (b.offUnits + b.wUnits) * unitW
                : cx +  b.offUnits * unitW;
            const top = baseY - bh;
            // skip if entirely off-screen
            if (x + bw < 0 || x > width) continue;

            ctx.fillStyle = `rgb(${Math.min(255,bldR+4)},${Math.min(255,bldG+4)},${Math.min(255,bldB+8)})`;
            ctx.fillRect(x, top, bw, bh);
            ctx.strokeStyle = 'rgba(140,140,170,0.4)';
            ctx.lineWidth   = 1;
            ctx.strokeRect(x + 0.5, top + 0.5, bw - 1, bh - 1);

            // neon stripes
            const [nr, ng, nb] = neons[b.neonIdx];
            ctx.save();
            ctx.shadowBlur  = glow * 0.6;
            ctx.shadowColor = `rgb(${nr},${ng},${nb})`;
            ctx.strokeStyle = `rgba(${nr},${ng},${nb},0.85)`;
            ctx.lineWidth   = 1.2;
            for (const yf of b.stripeYs) {
                const y = top + bh * yf;
                ctx.beginPath();
                ctx.moveTo(x + 1, y);
                ctx.lineTo(x + bw - 1, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ── triangular landmark (obelisk / monument) at dead-centre
        const triH = hy * 0.62;
        const triW = Math.max(40, Math.min(width, height) * 0.085);
        const top  = hy - triH;
        const baseL = cx - triW * 0.5;
        const baseR = cx + triW * 0.5;

        // body fill — subtle gradient so it has depth
        const grad = ctx.createLinearGradient(baseL, top, baseR, top);
        grad.addColorStop(0,   `rgb(${Math.min(255,bldR+2)},${Math.min(255,bldG+2)},${Math.min(255,bldB+8)})`);
        grad.addColorStop(0.5, `rgb(${Math.min(255,bldR+14)},${Math.min(255,bldG+14)},${Math.min(255,bldB+22)})`);
        grad.addColorStop(1,   `rgb(${Math.min(255,bldR+2)},${Math.min(255,bldG+2)},${Math.min(255,bldB+8)})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx,    top);          // apex
        ctx.lineTo(baseR, hy + 1);       // bottom right (at horizon)
        ctx.lineTo(baseL, hy + 1);       // bottom left
        ctx.closePath();
        ctx.fill();

        // neon outline (two edges of the triangle)
        const [oR, oG, oB] = neons[0];
        ctx.save();
        ctx.shadowBlur  = glow;
        ctx.shadowColor = `rgb(${oR},${oG},${oB})`;
        ctx.strokeStyle = `rgba(${oR},${oG},${oB},0.95)`;
        ctx.lineWidth   = 1.8;
        ctx.beginPath();
        ctx.moveTo(baseL, hy + 1);
        ctx.lineTo(cx,    top);
        ctx.lineTo(baseR, hy + 1);
        ctx.stroke();
        ctx.restore();

        // inner horizontal neon bands (parallel to base, shrinking with the triangle)
        const bands = 6;
        for (let i = 1; i <= bands; i++) {
            const t = i / (bands + 1);           // 0 at apex, 1 at base
            const y = top + triH * t;
            const halfW = (triW * 0.5) * t;
            const [nr, ng, nb] = neons[i % neons.length];
            ctx.save();
            ctx.shadowBlur  = glow * 0.7;
            ctx.shadowColor = `rgb(${nr},${ng},${nb})`;
            ctx.strokeStyle = `rgba(${nr},${ng},${nb},${(0.85 - 0.05 * (bands - i)).toFixed(3)})`;
            ctx.lineWidth   = 1.3;
            ctx.beginPath();
            ctx.moveTo(cx - halfW + 1, y);
            ctx.lineTo(cx + halfW - 1, y);
            ctx.stroke();
            ctx.restore();
        }

        // glowing apex dot
        ctx.save();
        ctx.shadowBlur  = glow * 1.4;
        ctx.shadowColor = `rgb(${oR},${oG},${oB})`;
        ctx.fillStyle   = `rgb(${oR},${oG},${oB})`;
        ctx.beginPath();
        ctx.arc(cx, top, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawRoad(rR, rG, rB, naR, naG, naB, nbR, nbG, nbB) {
        const sw = parseInt(gui.streetWidth.value);
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy = height * horizonPct;
        const groundY = 28;

        // pick near cz so the road edge reaches the bottom of the screen,
        // far cz huge so the far edge of the road sits right at the horizon
        const nearCz = groundY * FOV / Math.max(1, (height - hy));
        const farCz  = 1500;                  // visually meets the horizon
        const nearZ  = cameraZ + nearCz;
        const farZ   = cameraZ + farCz;

        const nl = project(-sw, groundY, nearZ);
        const nr = project( sw, groundY, nearZ);
        const fl = project(-sw, groundY, farZ);
        const fr = project( sw, groundY, farZ);

        if (nl && nr && fl && fr) {
            // asphalt fill — color comes through clearly now
            ctx.fillStyle = `rgb(${rR},${rG},${rB})`;
            ctx.beginPath();
            ctx.moveTo(nl.sx, nl.sy);
            ctx.lineTo(nr.sx, nr.sy);
            ctx.lineTo(fr.sx, fr.sy);
            ctx.lineTo(fl.sx, fl.sy);
            ctx.closePath();
            ctx.fill();
        }

        // sidewalk lines (cyan glow strips along each side)
        const glow = parseInt(gui.neonGlow.value);
        ctx.save();
        ctx.shadowBlur  = glow;
        ctx.shadowColor = `rgb(${nbR},${nbG},${nbB})`;
        ctx.strokeStyle = `rgba(${nbR},${nbG},${nbB},0.9)`;
        ctx.lineWidth   = 2;
        for (const side of [-1, 1]) {
            ctx.beginPath();
            let first = true;
            for (let z = 0.5; z < 80; z += 2) {
                const p = project(side * sw, 28, z);
                if (!p) continue;
                if (first) { ctx.moveTo(p.sx, p.sy); first = false; }
                else        ctx.lineTo(p.sx, p.sy);
            }
            ctx.stroke();
        }
        ctx.restore();

        // center pink line
        ctx.save();
        ctx.shadowBlur  = glow * 0.8;
        ctx.shadowColor = `rgb(${naR},${naG},${naB})`;
        ctx.strokeStyle = `rgba(${naR},${naG},${naB},0.75)`;
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        let first = true;
        for (let z = 0.5; z < 80; z += 2) {
            const p = project(0, 28, z);
            if (!p) continue;
            if (first) { ctx.moveTo(p.sx, p.sy); first = false; }
            else        ctx.lineTo(p.sx, p.sy);
        }
        ctx.stroke();
        ctx.restore();

        // straight line from near→far is a perspective straight line on screen, so
        // a single segment per kerb/lane is enough — also reaches all the way to horizon
        const draw2pt = (off, color, lw) => {
            const a = project(off, groundY, nearZ);
            const b = project(off, groundY, farZ);
            if (!a || !b) return;
            ctx.strokeStyle = color;
            ctx.lineWidth   = lw;
            ctx.beginPath();
            ctx.moveTo(a.sx, a.sy);
            ctx.lineTo(b.sx, b.sy);
            ctx.stroke();
        };

        // road-edge (kerb) lines, both sides
        draw2pt(-sw, 'rgba(245,245,255,0.95)', 2);
        draw2pt( sw, 'rgba(245,245,255,0.95)', 2);

        // inner lane lines
        draw2pt(-sw * 0.33, 'rgba(220,220,235,0.55)', 1.4);
        draw2pt( sw * 0.33, 'rgba(220,220,235,0.55)', 1.4);

        // dashed center markings — generated camera-relative each frame so they
        // are always evenly spaced from "right under you" to the horizon
        const DASH_LEN = 2.4;
        const GAP_LEN  = 3.6;
        const STEP     = DASH_LEN + GAP_LEN;          // one period
        // first dash position past the near plane, aligned to a global grid
        // so dashes don't slide weirdly relative to each other
        const z0 = Math.ceil(nearZ / STEP) * STEP;
        ctx.save();
        ctx.fillStyle = `rgba(250,250,255,0.95)`;
        for (let z = z0; z < farZ; z += STEP) {
            const p1 = project(0, groundY, z);
            const p2 = project(0, groundY, z + DASH_LEN);
            if (!p1 || !p2) continue;
            if (p1.sy - p2.sy < 0.5) continue;        // sub-pixel, skip
            const w  = Math.min(28, Math.max(2,   (sw * 0.04) * p1.k));
            const w2 = Math.min(28, Math.max(1.2, (sw * 0.04) * p2.k));
            ctx.beginPath();
            ctx.moveTo(p1.sx - w/2,  p1.sy);
            ctx.lineTo(p1.sx + w/2,  p1.sy);
            ctx.lineTo(p2.sx + w2/2, p2.sy);
            ctx.lineTo(p2.sx - w2/2, p2.sy);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    function drawBuildings(bldR, bldG, bldB, neons, lampR, lampG, lampB) {
        if (!gui.sideBuildings.checked) return;
        const glow = parseInt(gui.neonGlow.value);
        const fogAmt = parseInt(gui.fog.value) / 100;
        const [bgR, bgG, bgB] = hexRgb(gui.bgColor.value);
        const MAX_LW = 5;   // cap neon stripe screen width
        const NEAR   = 2.5; // skip buildings closer than this to avoid giant pop-in

        // Sort far → near so near buildings overpaint far ones
        const sorted = buildings.slice().sort((a, b) => b.z - a.z);

        for (const b of sorted) {
            if (b.z - cameraZ < NEAR) continue;
            const xInner = b.side * b.xOffset;             // edge nearest road
            const xOuter = b.side * (b.xOffset + b.w);     // far edge
            const zNear  = b.z;
            const zFar   = b.z + b.d;
            const yTop   = -b.h;
            const yBot   = 28;

            // 8 corners we may need (we mostly draw inner face + top + maybe front face)
            const innerNT = project(xInner, yTop, zNear);
            const innerNB = project(xInner, yBot, zNear);
            const innerFT = project(xInner, yTop, zFar);
            const innerFB = project(xInner, yBot, zFar);
            const outerNT = project(xOuter, yTop, zNear);
            const outerNB = project(xOuter, yBot, zNear);

            if (!innerNT || !innerNB || !innerFT || !innerFB) continue;

            // fog factor based on distance from camera
            const dist = b.z - cameraZ;
            const fog  = 1 - Math.min(1, dist / 70 * fogAmt);

            // ── front face (perpendicular to view): only visible when building is ahead AND camera not past it
            const frontVisible = b.z > cameraZ + 0.3 && outerNT && outerNB;
            if (frontVisible) {
                ctx.fillStyle = `rgb(${(bldR*fog + bgR*(1-fog))|0},${(bldG*fog + bgG*(1-fog))|0},${(bldB*fog + bgB*(1-fog))|0})`;
                ctx.beginPath();
                ctx.moveTo(outerNT.sx, outerNT.sy);
                ctx.lineTo(innerNT.sx, innerNT.sy);
                ctx.lineTo(innerNB.sx, innerNB.sy);
                ctx.lineTo(outerNB.sx, outerNB.sy);
                ctx.closePath();
                ctx.fill();
            }

            // ── inner side face (facing the road, the dominant face)
            ctx.fillStyle = `rgb(${(bldR*fog*0.85 + bgR*(1-fog*0.85))|0},${(bldG*fog*0.85 + bgG*(1-fog*0.85))|0},${(bldB*fog*0.85 + bgB*(1-fog*0.85))|0})`;
            ctx.beginPath();
            ctx.moveTo(innerNT.sx, innerNT.sy);
            ctx.lineTo(innerFT.sx, innerFT.sy);
            ctx.lineTo(innerFB.sx, innerFB.sy);
            ctx.lineTo(innerNB.sx, innerNB.sy);
            ctx.closePath();
            ctx.fill();

            // ── outline edges for definition
            ctx.strokeStyle = `rgba(${(bldR+40)|0},${(bldG+40)|0},${(bldB+50)|0},${(0.5*fog).toFixed(3)})`;
            ctx.lineWidth   = 1;
            ctx.beginPath();
            ctx.moveTo(innerNT.sx, innerNT.sy);
            ctx.lineTo(innerFT.sx, innerFT.sy);
            ctx.lineTo(innerFB.sx, innerFB.sy);
            ctx.lineTo(innerNB.sx, innerNB.sy);
            ctx.closePath();
            ctx.stroke();
            // vertical front edge
            if (frontVisible && outerNT) {
                ctx.beginPath();
                ctx.moveTo(outerNT.sx, outerNT.sy);
                ctx.lineTo(outerNB.sx, outerNB.sy);
                ctx.stroke();
            }

            // ── horizontal neon stripes wrapping inner face (STRAIGHT lines)
            for (const st of b.stripes) {
                const ny = yTop + (yBot - yTop) * st.yFrac;
                const [nr, ng, nb] = neons[st.colorIdx];
                const pA = project(xInner, ny, zNear);
                const pB = project(xInner, ny, zFar);
                if (!pA || !pB) continue;
                ctx.save();
                ctx.shadowBlur  = glow * fog;
                ctx.shadowColor = `rgb(${nr},${ng},${nb})`;
                ctx.strokeStyle = `rgba(${nr},${ng},${nb},${(0.95*fog).toFixed(3)})`;
                ctx.lineWidth   = Math.min(MAX_LW, Math.max(1, 2.2 * innerNT.k * 0.06));
                ctx.beginPath();
                ctx.moveTo(pA.sx, pA.sy);
                ctx.lineTo(pB.sx, pB.sy);
                ctx.stroke();
                ctx.restore();
            }

            // ── top neon edge along roofline (cleaner straight line)
            const [tr, tg, tb] = neons[b.neonIdx];
            ctx.save();
            ctx.shadowBlur  = glow * 0.8 * fog;
            ctx.shadowColor = `rgb(${tr},${tg},${tb})`;
            ctx.strokeStyle = `rgba(${tr},${tg},${tb},${(0.85*fog).toFixed(3)})`;
            ctx.lineWidth   = Math.min(MAX_LW, Math.max(1, 1.8 * innerNT.k * 0.05));
            ctx.beginPath();
            ctx.moveTo(innerNT.sx, innerNT.sy);
            ctx.lineTo(innerFT.sx, innerFT.sy);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawLamps(lampR, lampG, lampB) {
        if (!gui.sideBuildings.checked) return;
        const sw   = parseInt(gui.streetWidth.value);
        const glow = parseInt(gui.neonGlow.value);
        const fogAmt = parseInt(gui.fog.value) / 100;
        const sorted = lamps.slice().sort((a, b) => b.z - a.z);
        const NEAR     = 3;     // skip lamps too close to camera
        const MAX_HEAD = 14;    // cap lamp head pixel radius
        const MAX_LW   = 3.5;

        // Pole stands right at the road edge (just on the sidewalk side),
        // arm projects horizontally INWARD over the road,
        // head hangs at the end of the arm.
        const poleX    = side => side * (sw + 2);            // hugs the road kerb
        const armEndX  = side => side * (sw - sw * 0.22);    // ~22% into road
        const poleTopY = -24;
        const headY    = -21;
        const baseY    = 28;

        for (const l of sorted) {
            if (l.z - cameraZ < NEAR) continue;
            const pBase  = project(poleX(l.side), baseY,    l.z);
            const pTop   = project(poleX(l.side), poleTopY, l.z);
            const pHead  = project(armEndX(l.side), headY,  l.z);
            if (!pBase || !pTop || !pHead) continue;
            const dist = l.z - cameraZ;
            const fog  = 1 - Math.min(1, dist / 70 * fogAmt);
            if (fog <= 0.05) continue;

            const poleW = Math.min(MAX_LW, Math.max(1, 2 * pBase.k * 0.04));

            // vertical pole
            ctx.strokeStyle = `rgba(150,155,175,${(0.85*fog).toFixed(3)})`;
            ctx.lineWidth   = poleW;
            ctx.lineCap     = 'round';
            ctx.beginPath();
            ctx.moveTo(pBase.sx, pBase.sy);
            ctx.lineTo(pTop.sx,  pTop.sy);
            ctx.stroke();

            // horizontal arm projecting toward road centerline
            ctx.lineWidth = Math.max(1, poleW * 0.7);
            ctx.beginPath();
            ctx.moveTo(pTop.sx,  pTop.sy);
            ctx.lineTo(pHead.sx, pHead.sy);
            ctx.stroke();

            // short vertical drop from arm to head (so the head clearly hangs)
            const pHeadTop = project(armEndX(l.side), headY - 1.2, l.z);
            if (pHeadTop) {
                ctx.beginPath();
                ctx.moveTo(pHeadTop.sx, pHeadTop.sy);
                ctx.lineTo(pHead.sx,    pHead.sy);
                ctx.stroke();
            }

            // lamp head glow — bigger, capped so near lamps don't explode
            const r = Math.min(MAX_HEAD, Math.max(3.5, 7.5 * pHead.k * 0.04));
            ctx.save();
            ctx.shadowBlur  = glow * 1.6 * fog;
            ctx.shadowColor = `rgb(${lampR},${lampG},${lampB})`;
            ctx.fillStyle   = `rgba(${lampR},${lampG},${lampB},${(0.98*fog).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(pHead.sx, pHead.sy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // soft halo on ground directly under the lamp head
            const pG = project(armEndX(l.side), baseY - 0.4, l.z);
            if (pG) {
                const haloR = Math.min(60, Math.max(8, 26 * pHead.k * 0.08));
                const grd = ctx.createRadialGradient(pG.sx, pG.sy, 0, pG.sx, pG.sy, haloR);
                grd.addColorStop(0, `rgba(${lampR},${lampG},${lampB},${(0.22*fog).toFixed(3)})`);
                grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.arc(pG.sx, pG.sy, haloR, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawFog(bgR, bgG, bgB) {
        const fogAmt = parseInt(gui.fog.value) / 100;
        if (fogAmt <= 0) return;
        const horizonPct = parseInt(gui.horizon.value) / 100;
        const hy = height * horizonPct;
        const grd = ctx.createRadialGradient(width/2, hy, 0, width/2, hy, width * 0.7);
        grd.addColorStop(0,    `rgba(${bgR+20},${bgG+10},${bgB+30},${(0.6*fogAmt).toFixed(3)})`);
        grd.addColorStop(0.45, `rgba(${bgR},${bgG},${bgB},${(0.2*fogAmt).toFixed(3)})`);
        grd.addColorStop(1,    'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, hy - height*0.2, width, height*0.5);
    }

    // ── animate ──────────────────────────────────────────────────────────────
    function animate() {
        const [bgR, bgG, bgB] = hexRgb(gui.bgColor.value);
        const [rR, rG, rB]    = hexRgb(gui.roadColor.value);
        const [bldR, bldG, bldB] = hexRgb(gui.buildingColor.value);
        const neons = [
            hexRgb(gui.neonA.value),
            hexRgb(gui.neonB.value),
            hexRgb(gui.neonC.value),
        ];
        const [lampR, lampG, lampB] = hexRgb(gui.lampColor.value);
        const [moonR, moonG, moonB] = hexRgb(gui.moonColor.value);

        drawSky(bgR, bgG, bgB);
        drawStars();
        drawMoon(moonR, moonG, moonB);
        drawRoad(rR, rG, rB, neons[0][0], neons[0][1], neons[0][2], neons[1][0], neons[1][1], neons[1][2]);
        drawLandmark(bldR, bldG, bldB, neons);
        drawBuildings(bldR, bldG, bldB, neons, lampR, lampG, lampB);
        drawLamps(lampR, lampG, lampB);
        drawFog(bgR, bgG, bgB);

        cameraZ += parseFloat(gui.walkSpeed.value) * 0.012;
        recycle();

        requestAnimationFrame(animate);
    }

    // ── lifecycle ────────────────────────────────────────────────────────────
    function resize() {
        width  = canvas.width  = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    // ── panel wiring ─────────────────────────────────────────────────────────
    const panel     = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    gui.bgColor.addEventListener('input', () => {
        document.body.style.backgroundColor = gui.bgColor.value;
    });

    [['walkSpeed','speed-val'],['density','density-val'],['streetWidth','width-val'],
     ['buildingHeight','bheight-val'],['lampSpacing','lamp-val'],['neonGlow','glow-val'],
     ['horizon','hz-val'],['fog','fog-val']
    ].forEach(([id, vid]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(vid).textContent = e.target.value;
        });
    });

    ['density','lampSpacing'].forEach(id => {
        document.getElementById(id).addEventListener('change', buildScene);
    });

    window.addEventListener('resize', resize);
    resize();
    buildScene();
    animate();

    // Cycling rainbow accent for controls UI
    let _accentHue = Math.random() * 360;
    (function cycleAccent() {
        _accentHue = (_accentHue + 0.18) % 360;
        const accent = `hsl(${_accentHue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', accent);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = accent);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
