<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Shape Mosaic</title>
    <style>
        :root { --accent: #aaa; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; }

        #panel {
            position: fixed;
            right: 0; top: 0;
            height: 100vh;
            width: 270px;
            background: rgba(5, 5, 5, 0.93);
            border-left: 1px solid var(--accent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }
        #panel.open { transform: translateX(0); }

        #toggle-btn {
            position: fixed;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 28px; height: 60px;
            background: rgba(12, 12, 12, 0.88);
            border: 1px solid var(--accent);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            transition: right 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
        }
        #toggle-btn.open { right: 270px; }
        #toggle-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .panel-content { padding: 22px 20px; color: white; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #666; }
        .back-link { font-size: 11px; color: #666; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #ccc; }

        .row { margin-bottom: 18px; }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
            color: #666;
        }
        label .val { color: var(--accent); font-variant-numeric: tabular-nums; }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        input[type="color"] {
            border: none; width: 38px; height: 26px;
            cursor: pointer; background: none;
            border-radius: 5px; flex-shrink: 0;
        }
        select {
            width: 100%;
            background: #151515;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .color-hint { font-size: 11px; color: #555; }

        hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
    </style>
</head>
<body>

<button id="toggle-btn">&#8249;</button>

<div id="panel">
    <div class="panel-content">
        <div class="panel-header">
            <a href="index.html" class="back-link">← Index</a>
            <span class="panel-title">Controls</span>
        </div>

        <div class="row">
            <label>Shape Color</label>
            <div class="flex-row">
                <input type="color" id="color" value="#ffffff">
                <span class="color-hint">Stroke & glow hue</span>
            </div>
        </div>

        <div class="row">
            <label>Glow Intensity <span class="val" id="glow-val">0</span></label>
            <input type="range" id="glowIntensity" min="0" max="30" value="0">
        </div>

        <hr class="sep">

        <div class="row">
            <label>Shape Type</label>
            <select id="shapeType">
                <option value="mix">Mixed Shapes</option>
                <option value="square">Squares</option>
                <option value="circle">Circles</option>
                <option value="triangle">Triangles</option>
            </select>
        </div>

        <div class="row">
            <label>Fill Mode</label>
            <select id="fillMode">
                <option value="stroke">Stroke Only</option>
                <option value="fill">Fill Only</option>
                <option value="both">Stroke + Fill</option>
            </select>
        </div>

        <hr class="sep">

        <div class="row">
            <label>Movement Drift <span class="val" id="drift-val">50</span></label>
            <input type="range" id="drift" min="0" max="150" value="50">
        </div>

        <div class="row">
            <label>Grid Density <span class="val" id="grid-val">60</span></label>
            <input type="range" id="gridSize" min="30" max="100" value="60">
        </div>

        <div class="row">
            <label>Morph Speed <span class="val" id="speed-val">20</span></label>
            <input type="range" id="speed" min="1" max="60" value="20">
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const simplex = new SimplexNoise();

    const gui = {
        color:    document.getElementById('color'),
        glow:     document.getElementById('glowIntensity'),
        shape:    document.getElementById('shapeType'),
        fillMode: document.getElementById('fillMode'),
        drift:    document.getElementById('drift'),
        grid:     document.getElementById('gridSize'),
        speed:    document.getElementById('speed'),
    };

    // Live value readouts
    [['glowIntensity','glow-val'],['drift','drift-val'],
     ['gridSize','grid-val'],['speed','speed-val']
    ].forEach(([id, valId]) => {
        document.getElementById(id).addEventListener('input', e => {
            document.getElementById(valId).textContent = e.target.value;
        });
    });

    // Panel toggle
    const panel = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        toggleBtn.innerHTML = open ? '&#8250;' : '&#8249;';
    });

    let width, height, z = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    function drawTriangle(size) {
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size, size);
        ctx.lineTo(-size, size);
        ctx.closePath();
    }

    function renderShape(shape, size) {
        if (shape === 'circle') {
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
        } else if (shape === 'square') {
            ctx.beginPath();
            ctx.rect(-size, -size, size * 2, size * 2);
        } else {
            drawTriangle(size);
        }
    }

    function applyFill(lineColor, fillOpacity) {
        const mode = gui.fillMode.value;
        if (mode === 'stroke' || mode === 'both') ctx.stroke();
        if (mode === 'fill' || mode === 'both') {
            ctx.globalAlpha = fillOpacity * 0.25;
            ctx.fillStyle = lineColor;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    function animate() {
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(0, 0, width, height);

        const lineColor = gui.color.value;
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 1.5;

        const glowAmt = parseInt(gui.glow.value);
        ctx.shadowBlur = glowAmt;
        ctx.shadowColor = glowAmt > 0 ? lineColor : 'transparent';

        const spacing = parseInt(gui.grid.value);
        const driftMag = parseInt(gui.drift.value);
        const type = gui.shape.value;
        const zoom = 500;

        for (let x = spacing / 2; x < width + spacing; x += spacing) {
            for (let y = spacing / 2; y < height + spacing; y += spacing) {
                const nx = simplex.noise3D(x / zoom, y / zoom, z);
                const ny = simplex.noise3D(x / zoom + 50, y / zoom + 50, z);
                const nr = simplex.noise3D(x / zoom - 50, y / zoom - 50, z);

                ctx.save();
                ctx.translate(x + nx * driftMag, y + ny * driftMag);
                ctx.rotate(nr * Math.PI);
                const s = Math.abs(nr) * 0.7 + 0.3;
                ctx.scale(s, s);

                let currentShape = type;
                if (type === 'mix') {
                    const noiseVal = Math.abs(nx);
                    if (noiseVal < 0.33) currentShape = 'circle';
                    else if (noiseVal < 0.66) currentShape = 'square';
                    else currentShape = 'triangle';
                }

                renderShape(currentShape, spacing * 0.3);
                applyFill(lineColor, Math.abs(nx));

                ctx.restore();
            }
        }

        z += gui.speed.value * 0.0004;
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();

    // Cycling rainbow accent for controls UI
    let _accentHue = Math.random() * 360;
    (function cycleAccent() {
        _accentHue = (_accentHue + 0.18) % 360;
        const accent = `hsl(${_accentHue | 0}, 70%, 62%)`;
        document.documentElement.style.setProperty('--accent', accent);
        document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = accent);
        requestAnimationFrame(cycleAccent);
    })();
</script>
</body>
</html>
